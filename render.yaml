services:
  - type: web
    name: darken-tattoo-studio
    runtime: static
    rootDir: frontend
    buildCommand: yarn install && CI=false yarn build
    staticPublishPath: build
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
